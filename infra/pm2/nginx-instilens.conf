# /etc/nginx/sites-available/instilens  →  ln -s into sites-enabled
# No domain yet: listens on 8088 and answers to the server IP. When you get a domain:
#   listen 80; server_name app.yourdomain.com;   then `certbot --nginx -d app.yourdomain.com`
server {
    listen 8088;
    server_name _;

    root /opt/instilens/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;              # SSE (/events/stream)
        proxy_read_timeout 3600s;
    }
    location /health { proxy_pass http://127.0.0.1:8010/health; }
    location /docs   { proxy_pass http://127.0.0.1:8010/docs; }
    location /openapi.json { proxy_pass http://127.0.0.1:8010/openapi.json; }

    location / { try_files $uri $uri/ /index.html; }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    gzip on; gzip_types text/css application/javascript application/json;
}
