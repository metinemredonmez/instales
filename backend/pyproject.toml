[project]
name = "instilens"
version = "0.1.0"
description = "Smart-money & institutional intelligence platform. Turkey-first (KAP), global-ready (SEC)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "typer>=0.12",
  "sse-starlette>=2.1",
  "anthropic>=0.80",
  "pyjwt>=2.9",
  "argon2-cffi>=23",
  "alembic>=1.13",
  "pypdf>=6.18.1",
  "yfinance>=1.7.0",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
instilens = "instilens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/instilens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the idiom
